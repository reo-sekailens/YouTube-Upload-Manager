name: Nightly pre-release builds

# Every published artifact is intentionally unsigned and unnotarized.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-prerelease-main
  cancel-in-progress: true

jobs:
  prepare_nightly:
    name: Allocate nightly release number
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      title: ${{ steps.release.outputs.title }}
    steps:
      - uses: actions/checkout@v5
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(awk -F '"' '/^\[package\]/{in_package=1; next} in_package && /^version = / {print $2; exit}' src-tauri/Cargo.toml)"
          test -n "$app_version"
          prefix="v${app_version}-nightly."
          highest=0
          tags="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.prerelease) | .tag_name')"
          while IFS= read -r tag; do
            [[ "$tag" == "$prefix"* ]] || continue
            suffix="${tag#"$prefix"}"
            if [[ "$suffix" =~ ^[1-9][0-9]*$ ]]; then
              value=$((10#$suffix))
            # Migrate older letter-based nightlies (a=1, z=26, aa=27)
            # without reusing a previously published build number.
            elif [[ "$suffix" =~ ^[a-z]+$ ]]; then
              value=0
              for ((position = 0; position < ${#suffix}; position += 1)); do
                character="${suffix:position:1}"
                printf -v code '%d' "'$character"
                value=$((value * 26 + code - 96))
              done
            else
              continue
            fi
            if ((value > highest)); then
              highest=$value
            fi
          done <<< "$tags"

          build_number=$((highest + 1))
          echo "tag=${prefix}${build_number}" >> "$GITHUB_OUTPUT"
          echo "title=YouTube Upload Manager v${app_version} — Nightly #${build_number}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare_nightly
    runs-on: ${{ matrix.runner }}
    env:
      APP_RELEASE_CHANNEL: ${{ needs.prepare_nightly.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            args: --bundles nsis
          - name: Linux x64
            runner: ubuntu-22.04
            args: --bundles deb,appimage
          - name: macOS Apple Silicon
            runner: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macOS Intel
            runner: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.runner, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - run: npm run tauri -- build ${{ matrix.args }}
      - name: Package Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ffprobe = 'src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe'
          $license = 'src-tauri/binaries/ffprobe-license.txt'
          if (-not (Test-Path -LiteralPath $ffprobe -PathType Leaf)) { throw 'Verified Windows x64 FFprobe sidecar is missing.' }
          if (-not (Test-Path -LiteralPath $license -PathType Leaf)) { throw 'FFprobe license is missing.' }
          $binary = [System.IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $ffprobe))
          if ($binary.Length -lt 64 -or $binary[0] -ne 0x4D -or $binary[1] -ne 0x5A) { throw 'FFprobe is not a Windows PE binary.' }
          $peOffset = [BitConverter]::ToInt32($binary, 0x3C)
          if ($peOffset -lt 0 -or $peOffset + 6 -gt $binary.Length) { throw 'FFprobe has an invalid PE header offset.' }
          $machine = [BitConverter]::ToUInt16($binary, $peOffset + 4)
          if ($machine -ne 0x8664) { throw "FFprobe has machine 0x$($machine.ToString('X4')); expected Windows x64 (0x8664)." }
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/youtube-upload-manager.exe portable/YouTube-Upload-Manager.exe
          Copy-Item -LiteralPath $ffprobe portable/ffprobe.exe
          Copy-Item -LiteralPath $license portable/ffprobe-license.txt
          Compress-Archive -Path portable/YouTube-Upload-Manager.exe,portable/ffprobe.exe,portable/ffprobe-license.txt -DestinationPath portable/YouTube-Upload-Manager-windows-x64-portable.zip
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path 'portable/YouTube-Upload-Manager-windows-x64-portable.zip'))
          try {
            $entries = @($zip.Entries | ForEach-Object FullName)
            foreach ($required in @('YouTube-Upload-Manager.exe', 'ffprobe.exe', 'ffprobe-license.txt')) {
              if ($entries -notcontains $required) { throw "Portable archive is missing $required." }
            }
          } finally {
            $zip.Dispose()
          }
      - name: Package Linux portable AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p portable
          appimage="$(find src-tauri/target/release/bundle/appimage -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          cp "$appimage" portable/YouTube-Upload-Manager-linux-x64-portable.AppImage
          chmod +x portable/YouTube-Upload-Manager-linux-x64-portable.AppImage
      - name: Package macOS portable app ZIP
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p portable
          app="$(find src-tauri/target -type d -path '*/release/bundle/macos/*.app' -print -quit)"
          test -n "$app"
          architecture="${{ matrix.name == 'macOS Apple Silicon' && 'apple-silicon' || 'intel' }}"
          ditto -c -k --sequesterRsrc --keepParent "$app" "portable/YouTube-Upload-Manager-macos-${architecture}-portable.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: nightly-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/**
            portable/**
          if-no-files-found: error

  android:
    name: Android universal debug APK
    needs: prepare_nightly
    runs-on: ubuntu-22.04
    env:
      APP_RELEASE_CHANNEL: ${{ needs.prepare_nightly.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v5
        name: Restore Android NDK
        with:
          path: /usr/local/lib/android/sdk/ndk/27.0.12077973
          key: ${{ runner.os }}-android-ndk-27.0.12077973
      - uses: actions/cache@v5
        name: Restore Gradle dependencies
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - name: Initialize generated Android project
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          npm run tauri -- android init --ci
      - name: Build universal installable debug APK
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          npm run tauri -- android build --debug --apk --ci
      - uses: actions/upload-artifact@v6
        with:
          name: nightly-Android universal debug APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  publish:
    name: Publish next nightly pre-release
    needs: [prepare_nightly, build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
      - name: Publish nightly release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ needs.prepare_nightly.outputs.tag }}
          TITLE: ${{ needs.prepare_nightly.outputs.title }}
        run: |
          set -euo pipefail
          declare -a assets=()
          declare -A labels=()

          release_label() {
            local relative="$1"
            case "$relative" in
              *YouTube-Upload-Manager-windows-x64-portable.zip)
                printf '%s' 'Windows x64 portable ZIP (extract and run)'
                ;;
              */bundle/nsis/*.exe)
                printf '%s' 'Windows x64 installer (recommended)'
                ;;
              *YouTube-Upload-Manager-linux-x64-portable.AppImage)
                printf '%s' 'Linux x64 portable AppImage (run directly)'
                ;;
              */bundle/deb/*.deb)
                printf '%s' 'Linux x64 Debian package (install with your package manager)'
                ;;
              *Apple-Silicon*portable.zip|*apple-silicon*portable.zip)
                printf '%s' 'macOS Apple Silicon portable app ZIP (extract and open)'
                ;;
              *macOS-Intel*portable.zip|*macos-intel*portable.zip)
                printf '%s' 'macOS Intel portable app ZIP (extract and open)'
                ;;
              *macOS*Apple*Silicon*/bundle/macos/*.dmg)
                printf '%s' 'macOS Apple Silicon disk image (install)'
                ;;
              *macOS*Intel*/bundle/macos/*.dmg)
                printf '%s' 'macOS Intel disk image (install)'
                ;;
              *.apk)
                printf '%s' 'Android universal debug APK (install on Android)'
                ;;
              *)
                printf '%s' "$(basename "$relative")"
                ;;
            esac
          }

          while IFS= read -r -d '' asset; do
            case "$asset" in
              *.apk|*.AppImage|*.deb|*.dmg|*.exe|*.msi|*.zip) ;;
              *) continue ;;
            esac

            relative="${asset#release-assets/}"
            artifact="${relative%%/*}"
            label="$(release_label "$relative")"
            index=2
            while [[ -n "${labels[$label]:-}" ]]; do
              label="$(release_label "$relative") (${index})"
              ((index += 1))
            done
            labels["$label"]=1
            assets+=("$asset#$label")
          done < <(find release-assets -type f -print0)
          test "${#assets[@]}" -gt 0

          download_link() {
            local wanted="$1"
            local spec asset label
            for spec in "${assets[@]}"; do
              asset="${spec%%#*}"
              label="${spec#*#}"
              if [[ "$label" == "$wanted" ]]; then
                printf '[%s](https://github.com/%s/releases/download/%s/%s)' \
                  "$label" "$GH_REPO" "$TAG" "$(basename "$asset")"
                return 0
              fi
            done
            printf '%s (not available in this nightly)' "$wanted"
          }

          commit_message="$(gh api "repos/$GH_REPO/commits/$SHA" --jq '.commit.message')"
          commit_title="$(printf '%s\n' "$commit_message" | head -n 1)"
          commit_description="$(printf '%s\n' "$commit_message" | tail -n +2 | sed '/./,$!d')"
          short_sha="${SHA:0:12}"
          notes_file="$(mktemp)"
          cat > "$notes_file" <<EOF
          ## Build source

          - **Commit:** [\`${short_sha}\`](https://github.com/${GH_REPO}/commit/${SHA})
          - **Title:** ${commit_title}

          EOF
          if [[ -n "$commit_description" ]]; then
            cat >> "$notes_file" <<EOF
          **Description**

          ${commit_description}

          EOF
          fi
          cat >> "$notes_file" <<EOF
          ## Which download should I use?

          ### Windows

          - **$(download_link 'Windows x64 installer (recommended)'):** Run this on a normal 64-bit Windows PC to install the app and add standard Start-menu integration.
          - **$(download_link 'Windows x64 portable ZIP (extract and run)'):** Extract it anywhere you can write, then run **YouTube-Upload-Manager.exe**. No installer or administrator access is required. Windows WebView2 is still required.

          ### Linux

          - **$(download_link 'Linux x64 portable AppImage (run directly)'):** Mark it executable, then run it directly. Use this when you do not want to install a package.
          - **$(download_link 'Linux x64 Debian package (install with your package manager)'):** Use this on Debian, Ubuntu, or a compatible distribution when you prefer package-manager installation.

          ### macOS

          - Choose **Apple Silicon** for M-series Macs (M1, M2, M3, M4) and **Intel** only for older Intel Macs.
          - **$(download_link 'macOS Apple Silicon disk image (install)')** or **$(download_link 'macOS Intel disk image (install)'):** Open it and install the app normally.
          - **$(download_link 'macOS Apple Silicon portable app ZIP (extract and open)')** or **$(download_link 'macOS Intel portable app ZIP (extract and open)'):** Extract it, then open the contained `.app` bundle without an installer.

          ### Android

          - **$(download_link 'Android universal debug APK (install on Android)'):** Install it directly on an Android device. It is a debug build, not a Play Store release.

          ## Important

          These nightly artifacts are unsigned and may show your operating system's normal first-run security warning. Download only the artifact for your operating system and processor. Existing queues and OAuth credentials remain device-local and are never included in a release artifact.

          ---

          Automated pre-release from commit ${SHA}.
          EOF
          gh release create "$TAG" "${assets[@]}" \
            --target "$SHA" \
            --title "$TITLE" \
            --notes-file "$notes_file" \
            --prerelease

# The Android test APK is debug-signed by the Android build tooling so devices
# can install it. It uses no project keystore, certificate, or signing secret.
# iOS packaging still needs a macOS mobile project and Apple provisioning.
