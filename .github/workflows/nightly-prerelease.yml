name: Nightly pre-release builds

# Every published artifact is intentionally unsigned and unnotarized.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-prerelease-main
  cancel-in-progress: true

jobs:
  prepare_nightly:
    name: Allocate nightly release letter
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          alphabet=abcdefghijklmnopqrstuvwxyz
          app_version="$(awk -F '"' '/^\[package\]/{in_package=1; next} in_package && /^version = / {print $2; exit}' src-tauri/Cargo.toml)"
          test -n "$app_version"
          prefix="v${app_version}-nightly."
          highest=0
          tags="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.prerelease) | .tag_name')"
          while IFS= read -r tag; do
            [[ "$tag" == "$prefix"* ]] || continue
            suffix="${tag#"$prefix"}"
            [[ "$suffix" =~ ^[a-z]+$ ]] || continue
            value=0
            for ((position = 0; position < ${#suffix}; position += 1)); do
              character="${suffix:position:1}"
              printf -v code '%d' "'$character"
              value=$((value * 26 + code - 96))
            done
            if ((value > highest)); then
              highest=$value
            fi
          done <<< "$tags"

          next=$((highest + 1))
          suffix=""
          while ((next > 0)); do
            next=$((next - 1))
            suffix="${alphabet:next % 26:1}$suffix"
            next=$((next / 26))
          done
          echo "tag=${prefix}${suffix}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare_nightly
    runs-on: ${{ matrix.runner }}
    env:
      APP_RELEASE_CHANNEL: ${{ needs.prepare_nightly.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            args: --bundles nsis
          - name: Linux x64
            runner: ubuntu-22.04
            args: --bundles deb,appimage
          - name: macOS Apple Silicon
            runner: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macOS Intel
            runner: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.runner, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - run: npm run tauri -- build ${{ matrix.args }}
      - name: Package Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/youtube-upload-manager.exe portable/YouTube-Upload-Manager.exe
          Compress-Archive -Path portable/YouTube-Upload-Manager.exe -DestinationPath portable/YouTube-Upload-Manager-windows-x64-portable.zip
      - name: Package Linux portable AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p portable
          appimage="$(find src-tauri/target/release/bundle/appimage -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          cp "$appimage" portable/YouTube-Upload-Manager-linux-x64-portable.AppImage
          chmod +x portable/YouTube-Upload-Manager-linux-x64-portable.AppImage
      - name: Package macOS portable app ZIP
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p portable
          app="$(find src-tauri/target -type d -path '*/release/bundle/macos/*.app' -print -quit)"
          test -n "$app"
          architecture="${{ matrix.name == 'macOS Apple Silicon' && 'apple-silicon' || 'intel' }}"
          ditto -c -k --sequesterRsrc --keepParent "$app" "portable/YouTube-Upload-Manager-macos-${architecture}-portable.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: nightly-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/**
            portable/**
          if-no-files-found: error

  android:
    name: Android universal debug APK
    needs: prepare_nightly
    runs-on: ubuntu-22.04
    env:
      APP_RELEASE_CHANNEL: ${{ needs.prepare_nightly.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v5
        name: Restore Android NDK
        with:
          path: /usr/local/lib/android/sdk/ndk/27.0.12077973
          key: ${{ runner.os }}-android-ndk-27.0.12077973
      - uses: actions/cache@v5
        name: Restore Gradle dependencies
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - name: Initialize generated Android project
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          npm run tauri -- android init --ci
      - name: Build universal installable debug APK
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          npm run tauri -- android build --debug --apk --ci
      - uses: actions/upload-artifact@v6
        with:
          name: nightly-Android universal debug APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  publish:
    name: Publish next nightly pre-release
    needs: [prepare_nightly, build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
      - name: Publish nightly release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ needs.prepare_nightly.outputs.tag }}
        run: |
          declare -a assets=()
          declare -A labels=()
          while IFS= read -r -d '' asset; do
            case "$asset" in
              *.apk|*.AppImage|*.deb|*.dmg|*.exe|*.msi|*.zip) ;;
              *) continue ;;
            esac

            relative="${asset#release-assets/}"
            artifact="${relative%%/*}"
            label="${artifact// /-}-$(basename "$asset")"
            index=2
            while [[ -n "${labels[$label]:-}" ]]; do
              label="${artifact// /-}-${index}-$(basename "$asset")"
              ((index += 1))
            done
            labels["$label"]=1
            assets+=("$asset#$label")
          done < <(find release-assets -type f -print0)
          test "${#assets[@]}" -gt 0
          gh release create "$TAG" "${assets[@]}" \
            --target "$SHA" \
            --title "Nightly build ${TAG#*-nightly.}" \
            --notes "Automated pre-release from commit $SHA." \
            --prerelease

# The Android test APK is debug-signed by the Android build tooling so devices
# can install it. It uses no project keystore, certificate, or signing secret.
# iOS packaging still needs a macOS mobile project and Apple provisioning.
