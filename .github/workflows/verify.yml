name: Verify local application

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Gate production initial bundle budgets
        run: npm run performance:frontend:check
      - run: npm run test

  native:
    name: Native queue tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm run test:ffprobe
      - run: npm run prepare:ffprobe
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Gate deterministic native worker configuration
        run: npm run performance:native:check -- --configuration-only
      - name: Gate deterministic native query and schema budgets, then run native tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --features performance-harness
      - run: cargo check --manifest-path src-tauri/Cargo.toml
